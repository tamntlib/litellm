name: Publish tamntlib Docker Image

run-name: Publish litellm-database:${{ inputs.tag }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, for example v1.95.0"
        required: true
        type: string
      push_latest:
        description: "Also update the latest tag"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-tamntlib-litellm-database-${{ inputs.tag }}
  cancel-in-progress: false

env:
  GHCR_IMAGE: ghcr.io/tamntlib/litellm-database
  DOCKERHUB_IMAGE: docker.io/tamntlib/litellm-database

jobs:
  publish:
    name: Build and publish
    if: github.repository == 'tamntlib/litellm'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate inputs and credentials
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail

          if [[ ! "$IMAGE_TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::Invalid Docker image tag: $IMAGE_TAG"
            exit 1
          fi

          if [[ -z "$DOCKERHUB_USERNAME" ]]; then
            echo "::error::Repository variable DOCKERHUB_USERNAME is not configured"
            exit 1
          fi

          if [[ -z "$DOCKERHUB_TOKEN" ]]; then
            echo "::error::Repository secret DOCKERHUB_TOKEN is not configured"
            exit 1
          fi

      - name: Prepare image tags
        id: image
        env:
          IMAGE_TAG: ${{ inputs.tag }}
          PUSH_LATEST: ${{ inputs.push_latest }}
        run: |
          set -euo pipefail

          tags=(
            "${GHCR_IMAGE}:${IMAGE_TAG}"
            "${DOCKERHUB_IMAGE}:${IMAGE_TAG}"
          )

          if [[ "$PUSH_LATEST" == "true" ]]; then
            tags+=(
              "${GHCR_IMAGE}:latest"
              "${DOCKERHUB_IMAGE}:latest"
            )
          fi

          {
            echo "tags<<EOF"
            printf '%s\n' "${tags[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: docker.io
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile.database
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Verify published tags
        env:
          EXPECTED_DIGEST: ${{ steps.build.outputs.digest }}
          PUBLISHED_TAGS: ${{ steps.image.outputs.tags }}
        run: |
          set -euo pipefail

          while IFS= read -r image; do
            [[ -n "$image" ]] || continue

            digest=""
            inspect_output=""
            for attempt in {1..12}; do
              if inspect_output=$(docker buildx imagetools inspect "$image" 2>&1); then
                digest=$(awk '$1 == "Digest:" {print $2; exit}' <<< "$inspect_output")
                [[ -n "$digest" ]] && break
              fi

              echo "::warning::Unable to read remote digest for $image (attempt $attempt/12)"
              if [[ "$attempt" -lt 12 ]]; then
                sleep 5
              fi
            done

            if [[ -z "$digest" ]]; then
              printf '%s\n' "$inspect_output"
              echo "::error::Unable to read remote digest for $image after 12 attempts"
              exit 1
            fi

            if [[ "$digest" != "$EXPECTED_DIGEST" ]]; then
              echo "::error::$image resolved to $digest, expected $EXPECTED_DIGEST"
              exit 1
            fi

            echo "$image@$digest"
          done <<< "$PUBLISHED_TAGS"
